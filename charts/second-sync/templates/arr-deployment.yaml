apiVersion: apps/v1
kind: Deployment
metadata:
  name: arr-stack
  namespace: flux-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arr-stack
  template:
    metadata:
      labels:
        app: arr-stack
      annotations:
        # Roll the pod whenever the linker/init scripts change, so a running
        # arr-linker (which reads linker.sh once at startup) picks up edits.
        checksum/scripts: {{ include (print $.Template.BasePath "/scripts-configmap.yaml") . | sha256sum }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: ripnix
      terminationGracePeriodSeconds: 60
      # Lower ndots from the default 5 to 1: musl's resolver (used by the
      # linuxserver/* images) misbehaves when search-domain prefixed lookups
      # are tried first, causing all external indexer DNS lookups to fail.
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      initContainers:
      - name: key-derivator
        image: alpine
        command: ["/bin/sh", "/run/scripts/init.sh"]
        volumeMounts:
        - name: vpn-key
          mountPath: /etc/vpn/mull.key
          readOnly: true
        - name: shared-keys
          mountPath: /run/shared
        - name: config-overseerr
          mountPath: /jellyseerr
        - name: arr-scripts
          mountPath: /run/scripts
          readOnly: true
      containers:
      # --- VPN GATEWAY ---
      - name: gluetun
        image: {{ .Values.images.gluetun }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            export WIREGUARD_PRIVATE_KEY=$(cat /etc/vpn/mull.key | tr -d '\n\r ')
            exec /gluetun-entrypoint
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
          runAsUser: 0
        env:
        - name: VPN_SERVICE_PROVIDER
          value: "custom"
        - name: VPN_TYPE
          value: "wireguard"
        - name: WIREGUARD_ENDPOINT_IP
          value: "77.243.184.130"
        - name: WIREGUARD_ENDPOINT_PORT
          value: "51820"
        - name: WIREGUARD_PUBLIC_KEY
          value: "5ioE7vTw80KVx0S/zYOZonR5ZkR+uiNJogR9Pyqtwzg="
        - name: WIREGUARD_ADDRESSES
          value: "10.68.25.24/32"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: {{ .Values.vpn.localSubnets | quote }}
        - name: FIREWALL_INPUT_PORTS
          value: "5055,8989,7878,9091,51413,9696,6767,8080,11011,3000"
        volumeMounts:
        - name: vpn-key
          mountPath: /etc/vpn/mull.key
          readOnly: true

      # --- ARR APPS ---
      - name: transmission
        image: {{ .Values.images.transmission }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            export USER={{ .Values.transmission.username }}
            export PASS={{ .Values.transmission.password }}
            exec /init
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "UTC"
        volumeMounts:
        - name: shared-keys
          mountPath: /run/shared
          readOnly: true
        - name: config-transmission
          mountPath: /config
        - name: media
          mountPath: /downloads

      - name: sonarr
        image: {{ .Values.images.sonarr }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            export SONARR__AUTH__APIKEY=$(cat /run/shared/api_key)
            export SONARR__AUTH__METHOD=External
            exec /init
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        volumeMounts:
        - name: shared-keys
          mountPath: /run/shared
          readOnly: true
        - name: config-sonarr
          mountPath: /config
        - name: media
          mountPath: /media
        - name: media
          mountPath: /downloads

      - name: radarr
        image: {{ .Values.images.radarr }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            export RADARR__AUTH__APIKEY=$(cat /run/shared/api_key)
            export RADARR__AUTH__METHOD=External
            exec /init
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        volumeMounts:
        - name: shared-keys
          mountPath: /run/shared
          readOnly: true
        - name: config-radarr
          mountPath: /config
        - name: media
          mountPath: /media
        - name: media
          mountPath: /downloads

      - name: prowlarr
        image: {{ .Values.images.prowlarr }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            export PROWLARR__AUTH__APIKEY=$(cat /run/shared/api_key)
            export PROWLARR__AUTH__METHOD=External
            exec /init
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        volumeMounts:
        - name: shared-keys
          mountPath: /run/shared
          readOnly: true
        - name: config-prowlarr
          mountPath: /config

      - name: bazarr
        image: {{ .Values.images.bazarr }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            export BAZARR__AUTH__APIKEY=$(cat /run/shared/api_key)
            exec /init
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        volumeMounts:
        - name: shared-keys
          mountPath: /run/shared
          readOnly: true
        - name: config-bazarr
          mountPath: /config
        - name: media
          mountPath: /media
        - name: media
          mountPath: /downloads

      - name: overseerr
        image: {{ .Values.images.overseerr }}
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        volumeMounts:
        - name: config-overseerr
          mountPath: /app/config
        - name: overseerr-auth-patch
          mountPath: /app/dist/middleware/auth.js
          subPath: auth-middleware.js
        - name: overseerr-auth-patch
          mountPath: /app/dist/routes/auth.js
          subPath: auth-routes.js

      - name: flaresolverr
        image: {{ .Values.images.flaresolverr }}
        env:
        - name: LOG_LEVEL
          value: info
        - name: TZ
          value: UTC
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            memory: 2Gi
        volumeMounts:
        # Headless Chrome keeps renderer/IPC data in /dev/shm. k8s defaults it
        # to 64MB, which starves Chrome and makes Cloudflare challenges stall or
        # crash -> the "Timeout after 60s -> 500" failures Prowlarr sees as
        # Cloudflare rejects. This is the in-k8s equivalent of `--shm-size=1g`.
        - name: flaresolverr-dshm
          mountPath: /dev/shm

      # --- STALLED-DOWNLOAD CLEANUP ---
      # Watches the Sonarr/Radarr queues + Transmission for stalled / slow /
      # metadata-stuck downloads (the "stuck at 20%, never finishes" case that
      # the *arrs never flag as failed), removes + blocklists them, and triggers
      # a re-search so the next release is grabbed. Shares the pod netns, so it
      # reaches Sonarr/Radarr/Transmission over 127.0.0.1.
      # NOTE: arr/download-client connections are configured once via the web UI
      # (NodePort {{ .Values.ports.cleanuparr }}); the config persists in the PVC.
      - name: cleanuparr
        image: {{ .Values.images.cleanuparr }}
        env:
        - name: PORT
          value: "11011"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "UTC"
        volumeMounts:
        - name: config-cleanuparr
          mountPath: /config

      - name: homepage
        image: {{ .Values.images.homepage }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /app/config
            cp /app/config-cm/*.yaml /app/config/
            export HOMEPAGE_VAR_API_KEY=$(cat /run/shared/api_key)
            export HOMEPAGE_VAR_TR_USER={{ .Values.transmission.username | quote }}
            export HOMEPAGE_VAR_TR_PASS={{ .Values.transmission.password | quote }}
            exec /usr/local/bin/node server.js
        env:
        # Next.js standalone binds process.env.HOSTNAME, which defaults to the
        # IPv6 wildcard "::". The node has IPv6 disabled (ipv6.disable=1 in
        # boot.kernelParams), so that listen() fails with EAFNOSUPPORT (errno -97)
        # and the container crashloops.
        #
        # That single failure took down the WHOLE arr stack: one NotReady
        # container makes the pod NotReady, and Kubernetes then drops the pod from
        # the endpoints of EVERY service in it -- transmission, overseerr, sonarr,
        # radarr and prowlarr all had empty endpoints and their NodePorts refused
        # connections, while the applications themselves were healthy and
        # answering fine on the pod IP directly.
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "*"
        - name: SAFE_MODE
          value: "true"
        volumeMounts:
        - name: shared-keys
          mountPath: /run/shared
          readOnly: true
        - name: homepage-config
          mountPath: /app/config-cm
        - name: config-homepage
          mountPath: /app/config

      # --- AUTO-LINKER SIDE CAR ---
      - name: arr-linker
        image: debian:bookworm-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            # Wait for gluetun's DNS+VPN to be ready before fetching packages.
            # Note: we use a glibc-based image (debian) instead of alpine/musl
            # because musl's resolver has issues parsing some of gluetun's DNS
            # responses, causing getaddrinfo() to fail despite raw DNS working.
            echo "Waiting for DNS/VPN to come up..."
            export DEBIAN_FRONTEND=noninteractive
            i=0
            until apt-get update >/dev/null 2>&1 && apt-get install -y --no-install-recommends curl jq sqlite3 ca-certificates procps >/dev/null 2>&1; do
              i=$((i+1))
              if [ $i -ge 60 ]; then
                echo "apt-get install failed after 60 attempts, exiting"
                exit 1
              fi
              sleep 5
            done
            # debian's sqlite3 binary is named sqlite3; linker.sh uses 'sqlite3'
            echo "Packages installed."
            cat /run/scripts/linker.sh > /tmp/linker.sh
            bash /tmp/linker.sh
        env:
        - name: TR_USER
          value: {{ .Values.transmission.username | quote }}
        - name: TR_PASS
          value: {{ .Values.transmission.password | quote }}
        volumeMounts:
        - name: shared-keys
          mountPath: /run/shared
          readOnly: true
        - name: arr-scripts
          mountPath: /run/scripts
        - name: config-overseerr
          mountPath: /jellyseerr
        - name: config-bazarr
          mountPath: /bazarr-config
        - name: config-jellyfin
          mountPath: /jellyfin-config
        - name: config-prowlarr
          mountPath: /prowlarr-config
        - name: config-arm
          mountPath: /arm-config
          subPath: config

      volumes:
      - name: shared-keys
        emptyDir: {}
      # Backing for FlareSolverr's /dev/shm (headless Chrome). RAM-backed,
      # capped at 1Gi (counts against the flaresolverr container's mem limit).
      - name: flaresolverr-dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: arr-scripts
        configMap:
          name: arr-scripts
      - name: overseerr-auth-patch
        configMap:
          name: overseerr-auth-patch
      - name: vpn-key
        hostPath:
          path: /root/mull.key
          type: File
      - name: media
        persistentVolumeClaim:
          claimName: second-sync-media-pvc
      - name: config-sonarr
        persistentVolumeClaim:
          claimName: sonarr-config-pvc
      - name: config-radarr
        persistentVolumeClaim:
          claimName: radarr-config-pvc
      - name: config-transmission
        persistentVolumeClaim:
          claimName: transmission-config-pvc
      - name: config-prowlarr
        persistentVolumeClaim:
          claimName: prowlarr-config-pvc
      - name: config-bazarr
        persistentVolumeClaim:
          claimName: bazarr-config-pvc
      - name: config-overseerr
        persistentVolumeClaim:
          claimName: overseerr-config-pvc
      - name: config-jellyfin
        persistentVolumeClaim:
          claimName: jellyfin-config-pvc
      - name: config-arm
        persistentVolumeClaim:
          claimName: arm-config-pvc
      - name: config-homepage
        persistentVolumeClaim:
          claimName: homepage-config-pvc
      - name: config-cleanuparr
        persistentVolumeClaim:
          claimName: cleanuparr-config-pvc
      - name: homepage-config
        configMap:
          name: homepage-config
